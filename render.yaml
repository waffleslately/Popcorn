services:
  - type: web
    name: popcorn
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TMDB_API_KEY
        sync: false
      - key: ELECTRON_SKIP_BINARY_DOWNLOAD
        value: "1"
